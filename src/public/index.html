<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Control</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="title-bar">
        <h1>CarrE (Carry Efficiently)</h1>
    </header>
    <header>
        <nav>
            <button onclick="triggerAction('remote_control')">Remote Control</button>
            <button onclick="triggerAction('learn')">Learn</button>
            <button onclick="triggerAction('repeat')">Repeat</button>
            <button onclick="triggerAction('follow_me')">Follow Me</button>
            <button onclick="triggerAction('stop')">Stop</button> <!-- Stop button -->
        </nav>
    </header>

    <!-- Current Mode Display -->
    <div class="current-mode-container">
        <p id="current-mode">Current Mode: Idle</p>
    </div>

    <main>
        <div class="webcam">
            <img src="{{ url_for('video_feed') }}" alt="Webcam feed">
        </div>
    </main>

    <script>
        let joystickData = { x: 0, y: 0 };

        function triggerAction(action) {
            fetch(`/action/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                // alert(data.message);
                updateCurrentMode(action); // Update the current mode display
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Check the console for details.');
            });
        }

        function updateCurrentMode(action) {
            const modeElement = document.getElementById('current-mode');
            const modes = {
                'remote_control': 'Remote Control',
                'learn': 'Learn',
                'repeat': 'Repeat',
                'follow_me': 'Follow Me',
                'stop': 'Idle'
            };
            const modeText = modes[action] || 'Idle';
            modeElement.textContent = `Current Mode: ${modeText}`;
        }
        let isSending = false; // Flag to prevent sending too often

        function updateJoystickData() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0] && !isSending) {
                const joystick = gamepads[0];
                const x = joystick.axes[0].toFixed(2); // X-axis
                const y = joystick.axes[1].toFixed(2); // Y-axis
                const newJoystickData = { x: parseFloat(x), y: parseFloat(y) };

                // Check if the joystick data has changed (optional)
                if (JSON.stringify(newJoystickData) !== JSON.stringify(joystickData)) {
                    joystickData = newJoystickData;

                    // Send joystick data to the server
                    fetch('/joystick_input', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(joystickData),
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Server response:', data.message);
                    })
                    .catch(error => {
                        console.error('Error:', error.message);
                    });
                }

                // Set flag to indicate data is being sent, then clear it after delay
                isSending = true;
                setTimeout(() => {
                    isSending = false; // Reset flag after delay
                }, 100); // Delay in milliseconds (100ms here)
            }

            // Call again to keep checking for gamepad input
            requestAnimationFrame(updateJoystickData);
        }

        // Start listening for joystick input
        window.addEventListener('gamepadconnected', () => {
            console.log('Gamepad connected!');
            updateJoystickData();
        });

        window.addEventListener('gamepaddisconnected', () => {
            console.log('Gamepad disconnected!');
        });
    </script>
</body>
</html>
